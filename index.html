<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="迷宮入りしかけた事件を、あなたの推理で解決する謎解きファイル集。毎日の小謎と、定期的に届く新しい事件ファイル。">
<meta property="og:title" content="零課事件簿">
<meta property="og:description" content="毎日の小謎と、本格的な事件ファイルが遊べる謎解きサイト">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>零課事件簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 捜査課の事件簿。表紙＝本日の小謎・事件ファイル棚・次回予告・捜査官手帳。各ファイルは「資料→問い→回答→ヒント」の章が縦に並ぶ */
:root{
  --paper:#ECF0F2; --sheet:#F8FAFB; --ink:#15212C; --muted:#5B6B78; --line:#C9D3DA;
  --accent:#2F44C8; --tag:#F0D44C; --tag-ink:#2A2306; --stamp:#B8332E; --ok:#1E7A52; --flame:#E08A1E;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1318; --sheet:#151D24; --ink:#DCE3E8; --muted:#8C9AA6; --line:#2A3641;
  --accent:#93A1FF; --tag:#E2C640; --tag-ink:#231D04; --stamp:#F0726B; --ok:#5FD39C; --flame:#F2A341; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1318; --sheet:#151D24; --ink:#DCE3E8; --muted:#8C9AA6; --line:#2A3641;
  --accent:#93A1FF; --tag:#E2C640; --tag-ink:#231D04; --stamp:#F0726B; --ok:#5FD39C; --flame:#F2A341; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.85;padding-inline:20px;padding-block:0 72px}
.wrap{max-width:900px;margin:0 auto}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--f-mono);letter-spacing:.06em}
.sr{position:absolute;left:-9999px}

.case-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 24px;padding-block:16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.case-bar a{color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:17px;letter-spacing:.08em}
.case-bar nav{display:flex;gap:16px}
.case-bar nav a{font-family:var(--f-body);font-size:13px;letter-spacing:0;color:var(--muted)}
.case-bar nav a:hover,.case-bar nav a[aria-current]{color:var(--ink)}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--sheet);padding:9px 20px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}

/* ===== 表紙 ===== */
.mast{padding-block:48px 8px}
.mast .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--muted);margin:0 0 8px}
.mast h1{font-family:var(--f-display);font-weight:800;font-size:clamp(48px,10vw,96px);line-height:1.05;margin:0;letter-spacing:.06em}
.mast p.lede{margin:18px 0 0;max-width:34em;font-size:16px}

.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;border-top:2px solid var(--ink);padding-top:12px;margin-top:52px}
.sec-head h2{font-family:var(--f-display);font-size:24px;margin:0}
.sec-head p{margin:0;color:var(--muted);font-size:13px}

.daily{margin-top:20px;background:var(--sheet);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 200px}
.daily .body{padding:24px;min-width:0}
.daily .date{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.1em}
.daily .dq{font-family:var(--f-display);font-size:21px;margin:6px 0 14px;line-height:1.6}
.daily .streak{border-left:1px solid var(--line);padding:24px 20px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.daily .streak b{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.daily .streak span{font-size:12px;color:var(--muted)}
.week{display:flex;gap:4px;margin-top:10px}
.week i{width:18px;height:18px;border:1px solid var(--line);display:block}
.week i.on{background:var(--ok);border-color:var(--ok)}

.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}
.fcard{position:relative;background:var(--sheet);border:1px solid var(--line);padding:0;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);min-width:0;transition:border-color .15s,transform .15s}
a.fcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.fcard .emb{aspect-ratio:16/10;border-bottom:1px solid var(--line);display:block;width:100%;max-width:100%}
.fcard .in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.fcard .no{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--muted)}
.fcard h3{font-family:var(--f-display);font-size:20px;margin:0;line-height:1.4;text-wrap:balance}
.fcard .meta{font-size:12px;color:var(--muted)}
.fcard .state{margin-top:auto;padding-top:10px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{flex:1;height:4px;background:var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.fcard .seal{position:absolute;top:10px;right:10px;border:2px solid var(--stamp);color:var(--stamp);font-family:var(--f-display);font-size:13px;padding:0 8px;transform:rotate(6deg);background:var(--sheet)}
.fcard.soon{border-style:dashed;color:var(--muted)}
.fcard.soon h3{color:var(--ink)}
.count-down{font-family:var(--f-mono);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}

.notebook{margin-top:20px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.badge{background:var(--sheet);border:2px solid var(--ink);padding:22px;display:grid;gap:4px}
.badge .rk{font-family:var(--f-display);font-size:34px;line-height:1.2}
.badge .next{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:var(--line);gap:1px}
.stats div{background:var(--sheet);padding:14px 16px}
.stats b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:12px;color:var(--muted)}

/* ===== ファイル ===== */
.cover{padding-block:44px 24px}
.cover .file{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--muted);margin:0 0 10px}
.cover h1{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,8vw,72px);line-height:1.15;margin:0;text-wrap:balance}
.cover .lede{font-size:16px;margin:22px 0 0;max-width:36em}
.cover .lede p{margin:0 0 8px}
.cover .rules{margin:18px 0 0;padding:14px 18px;border-left:3px solid var(--ink);background:var(--sheet);font-size:13px;color:var(--muted);max-width:42em}
.cast{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.cast div{background:var(--sheet);border:1px solid var(--line);padding:8px 12px;font-size:13px}
.cast b{font-family:var(--f-display);font-size:15px;margin-right:6px}

.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-block:1px solid var(--line);padding-block:10px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.board a{flex:1 0 auto;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:13px;padding:4px 10px;border:1px solid transparent;white-space:nowrap}
.board a:hover{color:var(--ink);border-color:var(--line)}
.board a i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--f-mono);font-size:11px}
.board a.done{color:var(--ink)}
.board a.done i{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.board a.locked i{border-style:dashed}
.board .count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-left:12px;white-space:nowrap}

.ch{margin-top:56px;scroll-margin-top:64px}
.ch-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 16px;border-top:2px solid var(--ink);padding-top:12px}
.ch-head .no{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;color:var(--muted)}
.ch-head h2{font-family:var(--f-display);font-size:28px;margin:0;line-height:1.3}
.ch-head .lv{margin-left:auto;font-size:12px;color:var(--muted)}
.story{margin:16px 0 0;max-width:40em}
.story p{margin:0 0 10px}

.doc{position:relative;margin-top:20px;background:var(--sheet);border:1px solid var(--line);padding:28px 24px 22px}
.doc .tag{position:absolute;top:-1px;left:20px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.14em;padding:5px 10px 9px;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.doc h3{font-family:var(--f-display);font-size:18px;margin:6px 0 12px}
.doc .note{font-size:13px;color:var(--muted);margin:12px 0 0}
.doc ol.clues{margin:0;padding-left:1.4em;display:grid;gap:4px}
.pager{font-family:var(--f-mono);font-size:clamp(26px,6vw,40px);letter-spacing:.2em;text-align:center;padding:18px 8px;border:1px solid var(--line);background:var(--paper);font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:16px}
.keypad span{border:1px solid var(--line);background:var(--paper);text-align:center;padding:6px 0;line-height:1.2}
.keypad b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.keypad small{font-size:12px;color:var(--muted)}
.keypad .blank{visibility:hidden}
.testimony{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.testimony li{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:start;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.testimony li:last-child{border-bottom:0;padding-bottom:0}
.testimony b{font-family:var(--f-display)}
.testimony q{quotes:"「" "」"}
.shelf{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding:8px 4px 0;border-bottom:6px solid var(--muted)}
.book{position:relative;writing-mode:vertical-rl;font-family:var(--f-display);font-size:15px;letter-spacing:.12em;padding:14px 8px;border:1px solid var(--line);background:var(--paper);min-height:170px;flex:0 0 auto}
.book:nth-child(2n){min-height:150px}
.book:nth-child(3n){min-height:185px}
.book .sticker{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);writing-mode:horizontal-tb;font-family:var(--f-mono);font-size:11px;background:var(--tag);color:var(--tag-ink);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;letter-spacing:0}
.memo{margin-top:14px;font-family:var(--f-display);font-size:16px;padding:12px 16px;border:1px dashed var(--line);transform:rotate(-.6deg);background:var(--paper)}
.figrow{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.figrow svg{flex:0 0 auto;max-width:100%}
.figrow p{margin:0;flex:1 1 220px;min-width:0}
.plan{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}

/* ロジック表 */
.grid-wrap{overflow-x:auto;margin-top:16px}
table.logic{border-collapse:collapse;margin:0 auto;font-size:14px}
.logic th{font-weight:500;padding:6px 10px;white-space:nowrap}
.logic thead th{font-family:var(--f-display);font-size:14px}
.logic tbody th{text-align:right;font-family:var(--f-display)}
.logic td{border:1px solid var(--line);padding:0}
.logic button{width:52px;height:44px;border:0;background:var(--paper);cursor:pointer;font-size:20px;font-family:var(--f-display)}
.logic button:hover{background:var(--line)}
.logic button.o{color:var(--ok)}
.logic button.x{color:var(--stamp)}

/* キーボード */
.screen{font-family:var(--f-mono);font-size:clamp(26px,6vw,38px);letter-spacing:.3em;padding:18px;text-align:center;background:var(--ink);color:var(--paper);border-radius:4px 4px 0 0}
.screen::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kbd{display:grid;gap:5px;padding:14px;border:1px solid var(--line);border-top:0;background:var(--paper);overflow-x:auto}
.kbd div{display:flex;gap:5px;justify-content:center}
.kbd div:nth-child(2){padding-left:16px}
.kbd div:nth-child(3){padding-left:40px}
.kbd span{width:32px;height:34px;flex:0 0 auto;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;border-radius:3px}

/* 金庫 */
table.hb{border-collapse:collapse;width:100%;max-width:520px;font-variant-numeric:tabular-nums}
.hb th,.hb td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:center}
.hb th{font-size:12px;color:var(--muted);font-weight:500}
.hb td:first-child{font-family:var(--f-mono);font-size:22px;letter-spacing:.3em}
.hb td{font-family:var(--f-mono)}

/* FILE 03：ダイヤ図・天秤・暗号・カレンダー */
.dia{display:block;width:760px;max-width:none;height:auto}
.legend{margin:12px 0 0;padding-left:1.2em;font-size:13px;color:var(--muted);display:grid;gap:2px}
.bal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bal svg{width:160px;max-width:47%;height:auto;flex:0 0 auto}
.cipher{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:16px}
.cipher span{width:38px;border:1px solid var(--line);background:var(--paper);text-align:center;line-height:1.5;padding:4px 0}
.cipher b{display:block;font-family:var(--f-display);font-size:20px}
.cipher small{display:block;font-size:16px;color:var(--muted)}
.gojuon{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;margin-top:14px;font-family:var(--f-display);font-size:15px}
.gojuon span{border-bottom:1px solid var(--line);padding:0 2px;letter-spacing:.15em}
.calfig{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}

/* FILE 05：モールス表 */
.morse{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:2px 12px;margin-top:16px;font-size:13px}
.morse span{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border-bottom:1px dotted var(--line);padding:1px 2px;min-width:0}
.morse b{font-family:var(--f-display);font-weight:600;color:var(--ink)}
.morse i{font-style:normal;font-family:var(--f-mono);color:var(--ink);white-space:nowrap}

/* 問いと回答 */
.ask{margin-top:20px;display:grid;gap:12px}
.ask .q{font-family:var(--f-display);font-size:19px;margin:0}
.ask form,.daily form{display:flex;flex-wrap:wrap;gap:8px}
.ask input,.daily input{flex:1 1 200px;min-width:0;border:1px solid var(--ink);background:var(--paper);padding:9px 12px;border-radius:0}
.ask input{background:var(--sheet)}
.msg{min-height:1.6em;font-size:14px;margin:0}
.msg.ng{color:var(--stamp)}
.msg.okm{color:var(--ok)}
.hints{display:flex;flex-wrap:wrap;gap:8px}
.hintbox{font-size:14px;padding:10px 14px;background:var(--sheet);border-left:3px solid var(--tag);margin:0}
.hintbox b{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);margin-right:8px}
.solved{margin-top:20px;border:2px solid var(--ok);padding:18px 20px;position:relative;background:var(--sheet)}
.solved .seal{position:absolute;top:-16px;right:16px;background:var(--paper);color:var(--ok);border:2px solid var(--ok);font-family:var(--f-display);font-size:14px;padding:2px 10px;transform:rotate(4deg)}
.solved h4{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.solved p{margin:0}
.lockcard{margin-top:20px;border:1px dashed var(--line);padding:28px 24px;text-align:center;color:var(--muted)}
.lockcard b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);margin-bottom:4px}
.ending{margin-top:28px;border:2px solid var(--ink);padding:32px 24px;background:var(--sheet)}
.ending h3{font-family:var(--f-display);font-size:clamp(24px,4vw,32px);margin:0 0 12px}
.ending p{margin:0 0 10px;max-width:40em}
.share{margin-top:18px;display:grid;gap:8px;max-width:520px}
.share textarea{width:100%;min-height:80px;resize:none;font:inherit;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:10px}
.nextfile{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px}

footer{margin-top:64px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}

@media (max-width:760px){
  .files{grid-template-columns:1fr 1fr}
  .notebook{grid-template-columns:1fr}
  .daily{grid-template-columns:1fr}
  .daily .streak{border-left:0;border-top:1px solid var(--line);flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px 14px}
  .daily .streak b{font-size:32px}
}
@media (max-width:520px){
  .files{grid-template-columns:1fr}
  .testimony li{grid-template-columns:1fr;gap:0}
  .keypad{grid-template-columns:repeat(3,56px)}
  .kbd span{width:26px;height:30px;font-size:11px}
  .kbd div:nth-child(2){padding-left:12px}.kbd div:nth-child(3){padding-left:28px}
  .logic button{width:44px}
}
/* FILE 06：お絵かきロジック */
table.nono{font-size:11px}
table.nono th{padding:2px 4px;font-family:var(--f-mono);font-size:11px;font-weight:500;line-height:1.25;white-space:nowrap}
table.nono thead th{font-family:var(--f-mono);font-size:11px;vertical-align:bottom;text-align:center}
table.nono button{width:25px;height:25px;font-size:12px;font-family:var(--f-mono);display:block}
table.nono button.o{background:var(--ink);color:var(--ink)}
table.nono button.x{color:var(--muted)}
table.nono td:nth-child(6){border-right:2px solid var(--muted)}
table.nono tbody tr:nth-child(5) td{border-bottom:2px solid var(--muted)}
@media (max-width:400px){table.nono button{width:22px;height:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="case-bar">
    <a href="#">零課事件簿</a>
    <nav aria-label="メニュー">
      <a href="#" data-nav="home">表紙</a>
      <a href="#file01" data-nav="file01">FILE 01</a>
      <a href="#file02" data-nav="file02">FILE 02</a>
    </nav>
  </div>
  <main id="view"></main>
  <footer>
    <span class="mono">警視庁 捜査零課 事件簿</span>
    <button class="reset" id="reset" type="button">すべての記録を消す</button>
  </footer>
</div>

<script>
/* ============ 共通 ============ */
function norm(s){
  return String(s).normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s　、。・,.!！?？「」『』"'（）()]/g, "")
    .replace(/さん$/, "");
}
const $ = id => document.getElementById(id);
const KEY = "reika-v2";
let st = { files:{}, daily:{} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) st = Object.assign(st, s); } catch(e){}

function clockSVG(h, m){
  const ma = m * 6, ha = (h % 12) * 30 + m * 0.5, rad = d => d*Math.PI/180;
  const ticks = Array.from({length:12},(_,i)=>{const a=rad(i*30);const r1=i%3?78:72;return `<line x1="${90+Math.sin(a)*r1}" y1="${90-Math.cos(a)*r1}" x2="${90+Math.sin(a)*84}" y2="${90-Math.cos(a)*84}" stroke="var(--ink)" stroke-width="${i%3?1.5:3}"/>`}).join("");
  return `<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="鏡に映った、数字のない時計。短針は2と3の間、長針は5を指している">
    <circle cx="90" cy="90" r="86" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>${ticks}
    <line x1="90" y1="90" x2="${90+Math.sin(rad(ha))*44}" y2="${90-Math.cos(rad(ha))*44}" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="90" x2="${90+Math.sin(rad(ma))*68}" y2="${90-Math.cos(rad(ma))*68}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="90" r="5" fill="var(--stamp)"/></svg>`;
}

  const ends = [[95-dx, 30-dy, L], [95+dx, 30+dy, R]];
  return `<svg viewBox="0 0 190 112" role="img" aria-label="天秤。左に${L}、右に${R}。${tilt?"右に傾いている":"つり合っている"}">
    <path d="M95 30 L82 100 H108Z" fill="var(--line)"/><line x1="66" y1="100" x2="124" y2="100" stroke="var(--ink)" stroke-width="2"/>

}

function pix6(rows, x, y, s, col){

  rows.forEach((r,j) => [...r].forEach((ch,i) => { if (ch === "#") d += `M${(x+i*s).toFixed(1)} ${(y+j*s).toFixed(1)}h${s}v${s}h-${s}z`; }));
  return `<path d="${d}" fill="${col||"var(--ink)"}"/>`;
}

function jstDay(t = Date.now()){ return Math.floor((t + 9*3600e3) / 86400e3); }
function dayLabel(d){ const x = new Date(d*86400e3); return `${x.getUTCFullYear()}.${String(x.getUTCMonth()+1).padStart(2,"0")}.${String(x.getUTCDate()).padStart(2,"0")}`; }
function streak(){
  let d = jstDay(), n = 0;
  if (!st.daily[d]) d--;
  while (st.daily[d]) { n++; d--; }
  return n;
}

/* ============ 階級 ============ */
function points(){
  let p = 0;
  for (const f of FILES){ const s = st.files[f.id]; if (!s) continue;
    p += Object.keys(s.solved).length * 3;
    if (s.solved.fin) p += 10;
    p -= Math.min(Object.values(s.hints).reduce((a,b)=>a+b,0), Object.keys(s.solved).length * 2);
  }
  return Math.max(0, p + Object.keys(st.daily).length * 2);
}
const RANKS = [[0,"巡査"],[10,"巡査部長"],[25,"警部補"],[45,"警部"],[70,"警視"],[100,"警視正"],[140,"零課 課長"]];
function rankInfo(){
  const p = points(); let i = 0; while (i+1 < RANKS.length && p >= RANKS[i+1][0]) i++;
  return { p, name:RANKS[i][1], next:RANKS[i+1] };
}

  const n = all.filter(c => s.solved[c.id]).length;
  let html = `<header class="cover"><p class="file">${f.no} ／ ${f.genre}　難易度 ${f.lv}</p><h1>${f.title}</h1>
    <div class="lede">${f.lede.map(p=>`<p>${p}</p>`).join("")}</div>
    ${f.cast?`<div class="cast">${f.cast.map(([a,b])=>`<div><b>${a}</b>${b}</div>`).join("")}</div>`:""}
    <p class="rules">答えはひらがな・カタカナ・漢字のどれで入力してもかまいません。詰まったらヒントを。進み具合はこのブラウザに保存されます。目安は${f.time}です。</p></header>
  <nav class="board" aria-label="捜査の進み具合">${all.map((c,i)=>{ const locked = c===f.final && !allMain(f);
    return `<a href="#${f.id}" data-jump="${c.id}" class="${s.solved[c.id]?"done":""} ${locked?"locked":""}"><i>${s.solved[c.id]?"✓":(c===f.final?"終":i+1)}</i>${c.no}</a>`; }).join("")}
    <span class="count">${n} / ${all.length} 解決</span></nav>`;
  html += f.chapters.map(c => chapterHTML(f, c, false)).join("") + chapterHTML(f, f.final, !allMain(f));
  if (s.solved.fin){
    const mins = s.start && s.end ? Math.max(1, Math.round((s.end - s.start)/60000)) : null;
    const used = Object.values(s.hints).reduce((a,b)=>a+b,0);
    const text = `零課事件簿 ${f.no}「${f.title}」を解決しました。${mins?`所要 ${mins} 分、`:""}ヒント ${used} 回。\n#零課事件簿 #謎解き`;
    const nextF = FILES[FILES.indexOf(f)+1];
    html += `<div class="ending">${f.ending}
      <div class="share"><label class="mono" for="share-text" style="font-size:11px;color:var(--muted)">結果をシェア（答えは含まれません）</label>
      <textarea id="share-text" readonly>${text}</textarea><button class="btn ghost" id="copy" type="button">結果をコピー</button></div>
      <div class="nextfile">${nextF?`<a class="btn" href="#${nextF.id}">次の事件：${nextF.no}「${nextF.title}」へ</a>`:`<a class="btn" href="#">表紙に戻る</a>`}</div></div>`;
  }
  $("view").innerHTML = html;
}

/* ============ ルーティング ============ */
function route(){
  const h = location.hash.replace("#","");
  current = FILES.find(f => f.id === h) || null;
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", (current ? current.id : "home") === a.dataset.nav));
  current ? renderFile(current) : renderHome();
  scrollTo(0,0);
}
function rerender(scrollId){
  current ? renderFile(current) : renderHome();
  if (scrollId) document.getElementById(scrollId)?.scrollIntoView({block:"start", behavior: reduced() ? "auto" : "smooth"});
}
addEventListener("hashchange", route);

/* ============ 入力 ============ */
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "daily-form"){
    const today = jstDay(), d = DAILY[today % DAILY.length], v = norm($("daily-in").value);
    if (!v) return;
    if (d.a.map(norm).includes(v)){ st.daily[today] = true; save(); rerender(); }
    else { $("daily-msg").className = "msg ng"; $("daily-msg").textContent = "違うようです。もう一度考えてみましょう。"; }
    return;
  }
  const form = e.target.closest("form[data-ch]"); if (!form || !current) return;
  const f = current, s = fs(f.id), id = form.dataset.ch, c = [...f.chapters, f.final].find(x => x.id === id);
  const v = norm(form.querySelector("input").value); if (!v) return;
  if (!s.start) s.start = Date.now();
  const ok = c.check ? c.check(v) : c.answers.map(norm).includes(v);
  if (ok){
    s.solved[id] = true; if (id === "fin") s.end = Date.now(); save();
    rerender((id !== "fin" && allMain(f) && !s.solved.fin) ? "fin" : id);
  } else {
    const m = $("msg-"+id); m.className = "msg ng"; m.textContent = "違うようです。資料をもう一度見てみましょう。";
  }
});
const CELL = ["","×","○"];
document.addEventListener("click", async e => {
  const jump = e.target.closest("[data-jump]");
  if (jump){ e.preventDefault(); document.getElementById(jump.dataset.jump)?.scrollIntoView({block:"start", behavior: reduced() ? "auto" : "smooth"}); return; }
  const cell = e.target.closest("[data-cell]");
  if (cell){ const k = (CELL.indexOf(cell.textContent)+1) % 3; cell.textContent = CELL[k]; cell.className = k===1?"x":k===2?"o":""; return; }
  if (!current) { if (e.target.id === "reset") return; }
  const h = e.target.closest("[data-hint]");
  if (h && current){ const s = fs(current.id); if (!s.start) s.start = Date.now(); s.hints[h.dataset.hint] = (s.hints[h.dataset.hint]||0)+1; save(); rerender(h.dataset.hint); return; }
  const g = e.target.closest("[data-giveup]");
  if (g && current){ const s = fs(current.id), id = g.dataset.giveup; s.solved[id] = true; s.hints[id] = (s.hints[id]||0)+1; if (id==="fin") s.end = Date.now(); save(); rerender(id); return; }
  if (e.target.id === "copy"){
    const ta = $("share-text");
    try { await navigator.clipboard.writeText(ta.value); e.target.textContent = "コピーしました"; }
    catch(err){ ta.focus(); ta.select(); e.target.textContent = "選択しました。手動でコピーしてください"; }
    setTimeout(()=>{ if ($("copy")) $("copy").textContent = "結果をコピー"; }, 2000);
  }
});
let resetArmed = false;
$("reset").onclick = () => {
  if (!resetArmed){ resetArmed = true; $("reset").textContent = "もう一度押すと、すべての記録を消します"; setTimeout(()=>{resetArmed=false;$("reset").textContent="すべての記録を消す";},3000); return; }
  st = { files:{}, daily:{} }; try { localStorage.removeItem("reika-file01"); } catch(e){}
  save(); resetArmed = false; $("reset").textContent = "すべての記録を消す"; route();
};

route();
</script>

</html>
